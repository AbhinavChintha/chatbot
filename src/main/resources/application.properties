spring.application.name=agentic-ai-chatbot

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/agentic_ai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Groq / Spring AI
# ===============================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b
spring.ai.openai.chat.options.max-tokens=450
app.ai.tokens.classification=250
app.ai.tokens.answer=400
app.ai.tokens.synthesis=450
app.rag.top-k=2
app.rag.similarity-threshold=0.65

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}


# ===============================
# PostgreSQL / pgvector
# ===============================
app.vectorstore.postgres.url=jdbc:postgresql://localhost:5432/agentic_ai_vectors
app.vectorstore.postgres.username=postgres
app.vectorstore.postgres.password=${POSTGRES_VECTOR_DB_PASSWORD}



spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.initialize-schema=true


# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# API Authentication
# ===============================
app.security.mode=basic
app.security.username=${APP_SECURITY_USERNAME:}
app.security.password=${APP_SECURITY_PASSWORD:}
app.security.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Admin-only monitoring; values exported by Prometheus are in seconds.
management.endpoints.web.exposure.include=health,prometheus
app.metrics.latency-window=PT5M
app.ai.classification-timeout=PT8S
app.chat.max-questions=100
app.chat.max-message-chars=2000
app.security.login.max-failures=5
app.security.login.window=PT10M
app.security.login.max-clients=10000
